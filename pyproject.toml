[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-soclaas-triage"
version = "0.1.0"
description = "Read-only classic Outlook triage using SoCLaaS and SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "openai>=1.50,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "tzdata>=2025.2",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
outlook-triage = "outlook_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

